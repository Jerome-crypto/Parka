services:
  # 1. Backend Express Web Service
  - type: web
    name: parka-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: parka-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://parka-eqpq.onrender.com

  # 2. Frontend Vite React Static Site
  - type: web
    name: parka
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://parka-server.onrender.com
      - key: VITE_SOCKET_URL
        value: https://parka-server.onrender.com
    headers:
      # Never cache index.html so users always get latest deploy
      - path: /index.html
        name: Cache-Control
        value: no-store, no-cache, must-revalidate, max-age=0
      # Cache hashed assets forever (content-hash fingerprinting = safe)
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Redirect/Rewrite rule for SPA React Router
      - type: rewrite
        source: /*
        destination: /index.html

# 3. PostgreSQL Database Instance
databases:
  - name: parka-db
    plan: free
